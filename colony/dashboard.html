<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Venture Colony</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#edf3fc;font:14px system-ui}.w{max-width:1500px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.live,.pos{color:#5cffad}.neg{color:#ff7474}.muted{color:#8493a7}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.card,.panel{background:#101722;border:1px solid #1e2a3b;border-radius:14px;padding:13px}.num{font-size:25px;font-weight:800}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:11px;margin-top:11px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:11px}.scroll{overflow:auto;max-height:390px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px;border-bottom:1px solid #1d2a3b;text-align:left}.pill{background:#1a2636;border-radius:12px;padding:3px 7px}canvas{width:100%;height:220px}button{background:#182438;color:#eaf2ff;border:1px solid #2c3c54;padding:7px 10px;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.w{padding:10px}}</style></head><body><div class=w>
<div class=head><div><h1>👑 Venture Colony</h1><div class=muted>Evolutionary market organism • prospective paper execution</div></div><div><b class=live>● LIVE</b> <span id=clock></span></div></div>
<div class=grid id=cards></div><div class=two><section class=panel><h2>Colony-native equity curve</h2><canvas id=curve></canvas></section><section class=panel><h2>Bloodlines</h2><div id=families></div><h3>Population</h3><div id=pop></div></section></div>
<div class=two><section class=panel><h2>🐜 Colony bets</h2><div class=scroll><table><thead><tr><th>Time</th><th>Family</th><th>Ants</th><th>Asset</th><th>Status</th><th>Net</th></tr></thead><tbody id=native></tbody></table></div></section><section class=panel><h2>👑 Queen / Sceptic</h2><div id=mind class=scroll></div></section></div>
<div class=three><section class=panel><h2>External signals</h2><div id=signals class=scroll></div></section><section class=panel><h2>Experiments</h2><div id=experiments></div></section><section class=panel><h2>Events</h2><div id=events class=scroll></div></section></div>
<div class=panel style="margin-top:11px"><h2>External-signal paper tape</h2><div class=scroll><table><tbody id=external></tbody></table></div></div></div>
<script>const f=(x,d=4)=>x==null?'—':Number(x).toFixed(d),e=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function chart(a){let c=document.querySelector('#curve'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);if(!a.length){g.fillText('Waiting for marked colony bets…',20,40);return}let s=0,v=a.map(x=>s+=+x.net_pnl),lo=Math.min(0,...v),hi=Math.max(0,...v),sp=hi-lo||1;g.strokeStyle=s>=0?'#5cffad':'#ff7474';g.lineWidth=2;g.beginPath();v.forEach((n,i)=>{let x=10+i/Math.max(1,v.length-1)*(w-20),y=h-15-(n-lo)/sp*(h-30);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
async function go(){try{let j=await(await fetch('/colony/live')).json(),n=j.native,s=n.summary,m=n.curve.length,w=n.curve.filter(x=>+x.net_pnl>0).length;clock.textContent=new Date().toLocaleTimeString();cards.innerHTML=[['COLONY BETS',s.n],['MARKED',m],['WIN RATE',m?f(w/m*100,1)+'%':'—'],['COLONY NET',f(s.net_pnl,6)],['ANTS',j.genomes.reduce((a,x)=>a+x.n,0)],['REAL TX',n.trades.filter(x=>x.broadcast).length+j.external.trades.filter(x=>x.broadcast).length]].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=num>${x[1]}</div></div>`).join('');chart(n.curve);
families.innerHTML=j.family_performance.map(x=>`<div class=card style="margin:6px 0"><b>${e(x.family||'unknown')}</b> • ${x.trades} bets • ${x.wins} wins<br><span class='${+x.net>=0?'pos':'neg'}'>net ${f(x.net,6)} SOL${x.net_gbp==null?'':` • £${f(x.net_gbp,2)}`}</span></div>`).join('')||'Awaiting marks';pop.innerHTML=j.genomes.map(x=>`<div><span class=pill>${e(x.family)}</span> <b>${x.n}</b> genomes</div>`).join('');native.innerHTML=n.trades.map(x=>{let a=x.attribution||{};return `<tr><td>${new Date(x.created_at).toLocaleTimeString()}</td><td>${e(a.family||'—')}</td><td>${a.ants??'—'}</td><td>${e(x.mint.slice(0,8))}…</td><td>${e(x.status)}</td><td class='${+x.net_pnl>=0?'pos':'neg'}'>${f(x.net_pnl,6)}</td></tr>`}).join('');
mind.innerHTML=j.mind.map(x=>`<div class=card style="margin:6px 0"><b>${e(x.status)}</b> <span class=muted>${new Date(x.observed_at).toLocaleTimeString()}</span><br><small>${e(JSON.stringify(x.core)).slice(0,260)}</small><br><small class=muted>Sceptic: ${e(JSON.stringify(x.sceptic)).slice(0,180)}</small></div>`).join('')||'Queen is quiet';signals.innerHTML=j.signals.map(x=>{let l=j.lineage.filter(y=>y.signal_id===x.id).map(y=>`${y.family}:${y.ants}`).join(' • ');return `<div><b>#${x.id}</b> ${e(x.direction)} ${e(x.mint.slice(0,8))}…<br><small class=muted>${e(l)}</small></div>`}).join('');
experiments.innerHTML=j.experiments.map(x=>`<div><span class=pill>${e(x.experiment_type)}</span> ${e(x.status)}</div>`).join('')||'None';events.innerHTML=j.events.map(x=>`<div><b>${e(x.event_type)}</b> <span class=muted>${new Date(x.created_at).toLocaleTimeString()}</span></div>`).join('');external.innerHTML=j.external.trades.map(x=>`<tr><td>${new Date(x.created_at).toLocaleTimeString()}</td><td>${e(x.mint.slice(0,8))}…</td><td>${e(x.status)}</td><td>${f(x.net_pnl,6)}</td></tr>`).join('')}catch(err){clock.textContent='reconnecting…'}}go();setInterval(go,5000);addEventListener('resize',go);</script></body></html>
