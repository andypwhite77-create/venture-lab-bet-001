services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: venturelab
      POSTGRES_USER: venturelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturelab -d venturelab"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  admin:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "admin_app:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - ./secrets/admin.env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
    expose:
      - "8001"
    volumes:
      - queen_state:/run/queen:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/admin/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  paper:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.paper_daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
      PAPER_STAKE_GBP: "25"
      PAPER_V2_START_AFTER_CANDIDATE_ID: "1395"
      PAPER_SOL_GBP_FALLBACK: "90.36"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mind:
    profiles: ["legacy"]
    build: .
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "colony.mind_daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@127.0.0.1:5432/venturelab
      OLLAMA_URL: http://127.0.0.1:11434/api/generate
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  swarm-queen:
    build: .
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "colony.swarm_queen_daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@127.0.0.1:5432/venturelab
      OLLAMA_URL: http://127.0.0.1:11434/api/generate
      SWARM_QUEEN_MODEL: qwen3:1.7b
      SWARM_QUEEN_INTERVAL_SECONDS: "300"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cpus: "2.0"
    volumes:
      - queen_state:/data:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  auditor:
    build: .
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "colony.audit_daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@127.0.0.1:5432/venturelab
      REVERSAL_CURRENT_CODE_START_ID: "1730"
      REVERSAL_CANARY_MIN_OPPS: "30"
      REVERSAL_CANARY_MIN_EXEC_COVERAGE: "0.90"
      REVERSAL_CANARY_MAX_DRAWDOWN_PCT: "30"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  accelerator:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.acceleration_daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
      ACCELERATOR_N_GENOMES: "10000"
    cpus: "0.5"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  colony:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.forward_loop"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  historical-bank:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.historical_backfill"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  queen-survival:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.queen_survival_loop"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
      QUEEN_EVAL_WORKERS: "2"
      SWARM_STRATEGIC_EVERY_CAMPAIGNS: "3"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cpus: "1.0"
    volumes:
      - queen_state:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  canary-controller:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "colony.canary_controller"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@postgres:5432/venturelab
      CANARY_LIVE_ENABLED: "0"
      CANARY_MAX_TRADE_GBP: "1.00"
      CANARY_FLOOR_GBP: "4.00"
      CANARY_MIN_VOTE_FRACTION: "0.80"
      CANARY_START_AFTER_CANDIDATE_ID: "2283"
      CANARY_ADDRESS_FILE: /run/canary/reversal_canary_address.txt
    volumes:
      - ./secrets/reversal_canary_address.txt:/run/canary/reversal_canary_address.txt:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  canary-executor:
    build: .
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "colony.canary_executor"]
    depends_on:
      postgres:
        condition: service_healthy
      hummingbot-gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://venturelab:${POSTGRES_PASSWORD}@127.0.0.1:5432/venturelab
      HUMMINGBOT_GATEWAY_API_KEY: ${HUMMINGBOT_GATEWAY_API_KEY}
      SOLANA_SECONDARY_RPC_URL: ${SOLANA_SECONDARY_RPC_URL:-https://api.mainnet-beta.solana.com}
      CANARY_ADDRESS_FILE: /run/canary/reversal_canary_address.txt
    volumes:
      - ./secrets/reversal_canary_address.txt:/run/canary/reversal_canary_address.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  hummingbot-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: venture-lab-canary-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:15888:15888"
    volumes:
      - ./gateway-files/conf:/home/gateway/conf
      - ./gateway-files/logs:/home/gateway/logs
      - ./gateway-certs:/home/gateway/certs
    environment:
      GATEWAY_PASSPHRASE: ${HUMMINGBOT_GATEWAY_PASSPHRASE}
      GATEWAY_API_KEY: ${HUMMINGBOT_GATEWAY_API_KEY}
      DEV: "true"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  queen_state:
